<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Propinas</title>
    <link rel="stylesheet" href="style.css">
    <!--Tipografia-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <!--Iconos-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="calculator">
        <h1><i class="bi bi-calculator"></i> Calculadora de Propinas</h1>
        <div class="input-group">
            <label for="bill">Total de la cuenta:</label>
            <input type="number" id="bill" placeholder="Ingrese el total de la cuenta" min="0" step="0.01">
        </div>
        <div class="input-group">
            <label for="tip">Porcentaje de propina:</label>
            <input type="number" id="tip" placeholder="Ingrese el porcentaje" min="0" max="100" value="15">
        </div>
        <button onclick="calcularPropina()">Calcular Propina</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
